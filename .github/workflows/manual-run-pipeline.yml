
name: Manual Test Run

# Ручной запуск пайплайна
on:
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - uses: actions/checkout@v4

      # 2. Устанавливаем Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: npm install

      # 4. Устанавливаем браузеры Playwright
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 5. Запускаем UI-тесты
      - name: Run UI tests
        run: npm run tests:ui -- --reporter=html
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-ui
          PLAYWRIGHT_HTML_OPEN: never

      # 6. Запускаем API-тесты
      - name: Run API tests
        run: npm run tests:api -- --reporter=html
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report-api
          PLAYWRIGHT_HTML_OPEN: never

      # 7. Загружаем отчёт UI-тестов
      - name: Upload UI test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-ui
          path: playwright-report-ui/
          retention-days: 7

      # 8. Загружаем отчёт API-тестов
      - name: Upload API test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-api
          path: playwright-report-api/
          retention-days: 7
